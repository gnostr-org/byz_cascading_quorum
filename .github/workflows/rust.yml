name: Rust

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: cargo-bins/cargo-binstall@v1
    - name: Install gnostr
      run: cargo binstall --no-confirm gnostr
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
